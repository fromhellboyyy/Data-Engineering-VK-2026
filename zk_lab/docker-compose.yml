networks:
  zknet:
    name: zknet

services:
  zoo1:
    image: zookeeper:3.9.6
    container_name: zoo1
    hostname: zoo1
    networks: [zknet]
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
      ZOO_TICK_TIME: 2000
      ZOO_INIT_LIMIT: 5
      ZOO_SYNC_LIMIT: 2
    volumes:
      - ./zdata1:/data
    ports: ["2181:2181"]

  zoo2:
    image: zookeeper:3.9.6
    container_name: zoo2
    hostname: zoo2
    networks: [zknet]
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
      ZOO_TICK_TIME: 2000
      ZOO_INIT_LIMIT: 5
      ZOO_SYNC_LIMIT: 2
    volumes:
      - ./zdata2:/data
    ports: ["2182:2181"]

  zoo3:
    image: zookeeper:3.9.6
    container_name: zoo3
    hostname: zoo3
    networks: [zknet]
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
      ZOO_TICK_TIME: 2000
      ZOO_INIT_LIMIT: 5
      ZOO_SYNC_LIMIT: 2
    volumes:
      - ./zdata3:/data
    ports: ["2183:2181"]