apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog
spec:
  restartPolicy: Never
  containers:
    - name: hog
      image: fromhellboy/k8s-skills-worker:1.0
      imagePullPolicy: IfNotPresent
      command: ["sleep","3600"]
      resources:
        requests:
          cpu: "30"
          memory: 64Mi
        limits:
          cpu: "30"
          memory: 64Mi